[package]
name    = "smoothie-elite-standalone"
version = "0.1.0"
edition = "2021"

[lib]
name          = "smoothie_elite_standalone_lib"
crate-type    = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "smoothie_elite_standalone"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

smoothie-validator = { path = "../../crates/smoothie-validator" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
log         = "0.4"
env_logger  = "0.11"
