[package]
name = "smoothie-cli-frontend"
version = "1.0.0-LTS"
edition = "2021"
authors = ["Smoothie Audio <smoothie@smoothieaudio.dev>"]
license = "MIT OR Apache-2.0"
description = "Professional CLI frontend for the Smoothie Elite ecosystem"

