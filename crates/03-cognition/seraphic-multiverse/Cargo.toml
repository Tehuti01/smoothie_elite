[package]
name = "seraphic-multiverse"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A Seraphic Technologies Elite audio plugin framework crate."
repository = "https://github.com/seraphic/smoothie-elite"

[dependencies]
smoothie-core = { workspace = true }
smoothie-math = { workspace = true }
smoothie-dsp = { workspace = true }
seraphic-agent = { path = "../seraphic-agent" , version = "1.0.0"}
atomic_float = "0.1"
wide = "0.7" # For SIMD
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
criterion = "0.5" # For high-end benchmarking
