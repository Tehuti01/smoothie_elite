[package]
name = "cargo-smoothie"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-smoothie"
path = "src/main.rs"

[dependencies]
smoothie-core = {workspace = true}
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
walkdir = "2.5"
regex = "1.10"
include_dir = "0.7"
