# ├──────────────────────────────────────────────────────────────────────────┤
# │ DESCRIPTION: Unified Monorepo Workspace Manifest for the Seraphic Tech ecosystem. │
# │ COMPONENTS:  [Workspace Members, Package Metadata, Global Dependencies]    │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ TECHNICAL NOTES: Master configuration for framework and applications.      │
# ╰──────────────────────────────────────────────────────────────────────────╯
#   SERAPHIC TECH - Precision Engineering

[workspace]
resolver = "2"
members = [
    "crates/01-silicon/*",
    "crates/02-resonance/*",
    "crates/03-cognition/*",
    "crates/04-holography/*",
    "crates/05-praxis/*",
    "crates/05-praxis/ironstack-plugin",
]

[workspace.package]
version = "1.0.0-LTS"
edition = "2021"
authors = ["Smoothie Audio <smoothie@smoothieaudio.dev>"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "High-performance Rust framework for building professional audio plugins"
repository = "https://github.com/tehuti01/smoothie_elite"
homepage = "https://github.com/tehuti01/smoothie_elite"
keywords = ["audio", "dsp", "vst", "plugin", "music"]
categories = ["multimedia::audio", "no-std"]

[workspace.dependencies]
# Core Internal Dependencies (Silicon)
smoothie-core = { path = "crates/01-silicon/core" }
smoothie-macros = { path = "crates/01-silicon/smoothie-macros" }
smoothie-math = { path = "crates/01-silicon/smoothie-math" }
smoothie-realtime-pool = { path = "crates/01-silicon/realtime-pool" }
smoothie-lock-free-queue = { path = "crates/01-silicon/lock-free-queue" }
smoothie-async = { path = "crates/01-silicon/async" }
smoothie-sync = { path = "crates/01-silicon/sync" }
smoothie-logging = { path = "crates/01-silicon/logging" }
smoothie-serde = { path = "crates/01-silicon/serde" }
smoothie-security = { path = "crates/01-silicon/smoothie-security" }

# Resonance (DSP & Audio)
smoothie-dsp = { path = "crates/02-resonance/dsp" }
smoothie-eq = { path = "crates/02-resonance/smoothie-eq" }
smoothie-dynamics = { path = "crates/02-resonance/smoothie-dynamics" }
smoothie-modulation = { path = "crates/02-resonance/smoothie-modulation" }
smoothie-physics = { path = "crates/02-resonance/smoothie-physics" }
smoothie-reverb = { path = "crates/02-resonance/smoothie-reverb" }
smoothie-spectrum = { path = "crates/02-resonance/smoothie-spectrum" }
smoothie-tuning = { path = "crates/02-resonance/smoothie-tuning" }
smoothie-advanced-dsp = { path = "crates/02-resonance/advanced-dsp" }
smoothie-gpu-fft = { path = "crates/02-resonance/gpu-fft" }
smoothie-convolution = { path = "crates/02-resonance/convolution" }
smoothie-spatial-audio = { path = "crates/02-resonance/spatial-audio" }
smoothie-synth = { path = "crates/02-resonance/synth" }
smoothie-effects = { path = "crates/02-resonance/effects" }

# Cognition (AI & Data)
smoothie-ai = { path = "crates/03-cognition/smoothie-ai" }
smoothie-ai-core = { path = "crates/03-cognition/smoothie-ai-core" }
smoothie-params = { path = "crates/03-cognition/smoothie-params" }
smoothie-graph = { path = "crates/03-cognition/smoothie-graph" }
smoothie-midi = { path = "crates/03-cognition/smoothie-midi" }
smoothie-preset = { path = "crates/03-cognition/smoothie-preset" }
smoothie-param-automation = { path = "crates/03-cognition/param-automation" }

# Holography (Graphics & UI)
smoothie-ui = { path = "crates/04-holography/smoothie-ui" }
smoothie-ui-core = { path = "crates/04-holography/smoothie-ui-core" }
smoothie-ui-render = { path = "crates/04-holography/smoothie-ui-render" }
smoothie-ui-vfx = { path = "crates/04-holography/smoothie-ui-vfx" }
smoothie-gpu-renderer = { path = "crates/04-holography/gpu-renderer" }
smoothie-vector-graphics = { path = "crates/04-holography/vector-graphics" }
smoothie-cli-frontend = { path = "crates/04-holography/smoothie-cli-frontend" }

# Praxis (Protocols & Platforms)
smoothie-vst3 = { path = "crates/05-praxis/smoothie-vst3" }
smoothie-au = { path = "crates/05-praxis/smoothie-au" }
smoothie-clap = { path = "crates/05-praxis/smoothie-clap" }
smoothie-aax = { path = "crates/05-praxis/smoothie-aax" }
smoothie-net = { path = "crates/05-praxis/smoothie-net" }
smoothie-standalone = { path = "crates/05-praxis/smoothie-standalone" }
smoothie-mastering = { path = "crates/05-praxis/smoothie-mastering" }
cargo-smoothie = { path = "crates/05-praxis/cargo-smoothie" }

# Distributed Extensions
smoothie-sync-distributed = { path = "crates/01-silicon/sync-distributed" }
smoothie-ai-distributed = { path = "crates/03-cognition/distributed-ai" }
smoothie-arrangement = { path = "crates/05-praxis/arrangement" }

# Third-Party Dependencies
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
colored = "2.1"
log = "0.4"
env_logger = "0.11"
walkdir = "2.5"
regex = "1.10"
wgpu = "0.19"
winit = "0.30"
egui = "0.26"
egui-wgpu = "0.26"
cpal = "0.15"
midir = "0.9"
bytemuck = "1.21"
wide = "0.7"
rayon = "1.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
crossbeam = "0.8"
parking_lot = "0.12"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = false
