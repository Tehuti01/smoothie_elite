# ├──────────────────────────────────────────────────────────────────────────┤
# │ DESCRIPTION: Unified Monorepo Workspace Manifest for the Seraphic Tech ecosystem. │
# │ COMPONENTS:  [Workspace Members, Package Metadata, Global Dependencies]    │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ TECHNICAL NOTES: Master configuration for framework and applications.      │
# ╰──────────────────────────────────────────────────────────────────────────╯
#   SERAPHIC TECH - Precision Engineering

[workspace]
resolver = "2"
members = [
    "crates/00-test-suite",
    "crates/01-silicon/*",
    "crates/02-resonance/*",
    "crates/03-cognition/*",
    "crates/04-holography/*",
    "crates/05-praxis/*",
    "crates/05-praxis/ironstack-plugin",
    "examples/*",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
authors = ["Smoothie Audio <smoothie@smoothieaudio.dev>"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "High-performance Rust framework for building professional audio plugins"
repository = "https://github.com/tehuti01/smoothie_elite"
homepage = "https://github.com/tehuti01/smoothie_elite"
keywords = ["audio", "dsp", "vst", "plugin", "music"]
categories = ["multimedia::audio", "no-std"]

[workspace.dependencies]
# Silicon (Core Layer)
smoothie-core = { path = "crates/01-silicon/core" , version = "0.0.2"}
smoothie-macros = { path = "crates/01-silicon/smoothie-macros" , version = "0.0.2"}
smoothie-math = { path = "crates/01-silicon/smoothie-math" , version = "0.0.2"}
smoothie-realtime-pool = { path = "crates/01-silicon/realtime-pool" , version = "0.0.2"}
smoothie-lock-free-queue = { path = "crates/01-silicon/lock-free-queue" , version = "0.0.2"}
smoothie-async = { path = "crates/01-silicon/async" , version = "0.0.2"}
smoothie-sync = { path = "crates/01-silicon/sync" , version = "0.0.2"}
smoothie-logging = { path = "crates/01-silicon/logging" , version = "0.0.2"}
smoothie-serde = { path = "crates/01-silicon/serde" , version = "0.0.2"}
smoothie-sync-distributed = { path = "crates/01-silicon/sync-distributed" , version = "0.0.2"}

# Resonance (DSP Layer)
smoothie-dsp = { path = "crates/02-resonance/dsp" , version = "0.0.2"}
smoothie-eq = { path = "crates/02-resonance/smoothie-eq" , version = "0.0.2"}
smoothie-dynamics = { path = "crates/02-resonance/smoothie-dynamics" , version = "0.0.2"}
smoothie-modulation = { path = "crates/02-resonance/smoothie-modulation" , version = "0.0.2"}
smoothie-physics = { path = "crates/02-resonance/smoothie-physics" , version = "0.0.2"}
smoothie-reverb = { path = "crates/02-resonance/smoothie-reverb" , version = "0.0.2"}
smoothie-spectrum = { path = "crates/02-resonance/smoothie-spectrum" , version = "0.0.2"}
smoothie-tuning = { path = "crates/02-resonance/smoothie-tuning" , version = "0.0.2"}
smoothie-advanced-dsp = { path = "crates/02-resonance/advanced-dsp" , version = "0.0.2"}
smoothie-gpu-fft = { path = "crates/02-resonance/gpu-fft" , version = "0.0.2"}
smoothie-convolution = { path = "crates/02-resonance/convolution" , version = "0.0.2"}
smoothie-spatial-audio = { path = "crates/02-resonance/spatial-audio" , version = "0.0.2"}
smoothie-synth = { path = "crates/02-resonance/synth" , version = "0.0.2"}
smoothie-effects = { path = "crates/02-resonance/effects" , version = "0.0.2"}
smoothie-ironstack = { path = "crates/02-resonance/ironstack" , version = "0.0.2"}
smoothie-granular = { path = "crates/02-resonance/smoothie-granular" , version = "0.0.2"}
smoothie-sound-design = { path = "crates/02-resonance/smoothie-sound-design" , version = "0.0.2"}
smoothie-audio-format = { path = "crates/02-resonance/smoothie-audio-format" , version = "0.0.2"}

# Cognition (Logic Layer)
smoothie-ai = { path = "crates/03-cognition/smoothie-ai" , version = "0.0.2"}
smoothie-ai-core = { path = "crates/03-cognition/smoothie-ai-core" , version = "0.0.2"}
smoothie-params = { path = "crates/03-cognition/smoothie-params" , version = "0.0.2"}
smoothie-graph = { path = "crates/03-cognition/smoothie-graph" , version = "0.0.2"}
smoothie-midi = { path = "crates/03-cognition/smoothie-midi" , version = "0.0.2"}
smoothie-preset = { path = "crates/03-cognition/smoothie-preset" , version = "0.0.2"}
smoothie-param-automation = { path = "crates/03-cognition/param-automation" , version = "0.0.2"}
smoothie-ai-distributed = { path = "crates/03-cognition/distributed-ai" , version = "0.0.2"}
seraphic-agent = { path = "crates/03-cognition/seraphic-agent" , version = "0.0.2"}
seraphic-multiverse = { path = "crates/03-cognition/seraphic-multiverse" , version = "0.0.2"}
seraphic-prime = { path = "crates/03-cognition/seraphic-prime" , version = "0.0.2"}

# Holography (UI Layer)
smoothie-ui = { path = "crates/04-holography/smoothie-ui" , version = "0.0.2"}
smoothie-ui-core = { path = "crates/04-holography/smoothie-ui-core" , version = "0.0.2"}
smoothie-ui-render = { path = "crates/04-holography/smoothie-ui-render" , version = "0.0.2"}
smoothie-ui-vfx = { path = "crates/04-holography/smoothie-ui-vfx" , version = "0.0.2"}
smoothie-gpu-renderer = { path = "crates/04-holography/gpu-renderer" , version = "0.0.2"}
smoothie-vector-graphics = { path = "crates/04-holography/vector-graphics" , version = "0.0.2"}
smoothie-cli-frontend = { path = "crates/04-holography/smoothie-cli-frontend" , version = "0.0.2"}
smoothie-frontend = { path = "crates/04-holography/smoothie-frontend" , version = "0.0.2"}

# Praxis (Platform Layer)
smoothie-vst3 = { path = "crates/05-praxis/smoothie-vst3" , version = "0.0.2"}
smoothie-au = { path = "crates/05-praxis/smoothie-au" , version = "0.0.2"}
smoothie-clap = { path = "crates/05-praxis/smoothie-clap" , version = "0.0.2"}
smoothie-aax = { path = "crates/05-praxis/smoothie-aax" , version = "0.0.2"}
smoothie-net = { path = "crates/05-praxis/smoothie-net" , version = "0.0.2"}
smoothie-standalone = { path = "crates/05-praxis/smoothie-standalone" , version = "0.0.2"}
smoothie-mastering = { path = "crates/05-praxis/smoothie-mastering" , version = "0.0.2"}
smoothie-plugin-host = { path = "crates/05-praxis/plugin-host" , version = "0.0.2"}
smoothie-arrangement = { path = "crates/05-praxis/arrangement" , version = "0.0.2"}
cargo-smoothie = { path = "crates/05-praxis/cargo-smoothie" , version = "0.0.2"}
seraphic-orchestrator = { path = "crates/05-praxis/seraphic-orchestrator" , version = "0.0.2"}
ironstack-plugin = { path = "crates/05-praxis/ironstack-plugin" , version = "0.0.2"}
ironstack-100 = { path = "crates/05-praxis/ironstack-standalone" , version = "0.0.2"}

# Third-Party Dependencies
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
colored = "2.1"
log = "0.4"
env_logger = "0.11"
walkdir = "2.5"
regex = "1.10"
wgpu = "0.19"
winit = "0.30"
egui = "0.26"
egui-wgpu = "0.26"
cpal = "0.15"
midir = "0.9"
bytemuck = "1.21"
wide = "0.7"
rayon = "1.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
crossbeam = "0.8"
parking_lot = "0.12"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
